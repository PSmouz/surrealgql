<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>SurrealDB GraphiQL</title>
  <style>
    body {
      margin: 0;

      --color-primary: 320, 95%, 43%;
      --color-secondary: 242, 51%, 61%;
      --color-tertiary: 188, 100%, 36%;
      --color-info: 208, 100%, 46%;
      --color-success: 158, 60%, 42%;
      --color-warning: 36, 100%, 41%;
      --color-error: 13, 93%, 58%;
      --color-neutral: 219, 28%, 32%;
      --color-base: 219, 28%, 100%;

      --alpha-secondary: 0.76;
      --alpha-tertiary: 0.5;
      --alpha-background-heavy: 0.15;
      --alpha-background-medium: 0.1;
      --alpha-background-light: 0.07;

      --font-family: 'Roboto', sans-serif;
      --font-family-mono: 'Fira Code', monospace;
      --font-size-hint: calc(12rem / 16);
      --font-size-inline-code: calc(13rem / 16);
      --font-size-body: calc(15rem / 16);
      --font-size-h4: calc(18rem / 16);
      --font-size-h3: calc(22rem / 16);
      --font-size-h2: calc(29rem / 16);
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --line-height: 1.5;

      --px-2: 2px;
      --px-4: 4px;
      --px-6: 6px;
      --px-8: 8px;
      --px-10: 10px;
      --px-12: 12px;
      --px-16: 16px;
      --px-20: 20px;
      --px-24: 24px;

      --border-radius-2: 2px;
      --border-radius-4: 4px;
      --border-radius-8: 8px;
      --border-radius-12: 12px;

      --popover-box-shadow: 0px 6px 20px rgba(59, 76, 106, 0.13),
      0px 1.34018px 4.46726px rgba(59, 76, 106, 0.0774939),
      0px 0.399006px 1.33002px rgba(59, 76, 106, 0.0525061);
      --popover-border: none;

      --sidebar-width: 60px;
      --toolbar-width: 40px;
      --session-header-height: 38.5px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        --color-primary: 338, 100%, 67%;
        --color-secondary: 243, 100%, 77%;
        --color-tertiary: 188, 100%, 44%;
        --color-info: 208, 100%, 72%;
        --color-success: 158, 100%, 42%;
        --color-warning: 30, 100%, 80%;
        --color-error: 13, 100%, 58%;
        --color-neutral: 219, 29%, 78%;
        --color-base: 219, 29%, 18%;
        --popover-box-shadow: none;
        --popover-border: 1px solid hsl(var(--color-neutral));
      }
    }

    #graphiql {
      height: 100dvh;
    }

    .loading {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }

    .surreal-button {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: hsla(var(--color-neutral), var(--alpha-secondary)) !important;
      height: calc(var(--sidebar-width) - (2 * var(--px-8))) !important;
      width: calc(var(--sidebar-width) - (2 * var(--px-8))) !important;
      flex-shrink: 0 !important;
    }

    .surreal-button.active {
      color: hsl(var(--color-neutral)) !important;
    }

    .surreal-button > svg {
      height: 32px !important;
      width: 32px !important;
    }

    .surreal-button-position {
      position: absolute !important;
      top: 50% !important;
      left: 8px !important;
      transform: translateY(-50%) !important;
    }
  </style>
  <link href="https://esm.sh/graphiql/dist/style.css" rel="stylesheet"/>
  <link href="https://esm.sh/@graphiql/plugin-explorer/dist/style.css"
        rel="stylesheet"/>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.1.0",
        "react/": "https://esm.sh/react@19.1.0/",
        "react-dom": "https://esm.sh/react-dom@19.1.0",
        "react-dom/": "https://esm.sh/react-dom@19.1.0/",
        "graphiql": "https://esm.sh/graphiql?standalone&external=react,react-dom,@graphiql/react,graphql",
        "graphiql/": "https://esm.sh/graphiql/",
        "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer?standalone&external=react,@graphiql/react,graphql",
        "@graphiql/react": "https://esm.sh/@graphiql/react?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
        "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit?standalone&external=graphql",
        "graphql": "https://esm.sh/graphql@16.11.0",
        "@emotion/is-prop-valid": "data:text/javascript,"
      }
    }
  </script>
  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import {GraphiQL, HISTORY_PLUGIN} from 'graphiql';
    import {createGraphiQLFetcher} from '@graphiql/toolkit';
    import {explorerPlugin} from '@graphiql/plugin-explorer';
    import {Dialog, UnStyledButton} from '@graphiql/react';
    import 'graphiql/setup-workers/esm.sh';

    const SurrealDBIcon = () => React.createElement('svg',
        {
          xlmns: 'http://www.w3.org/2000/svg',
          viewBox: '0 0 24 24',
          className: 'graphiql-toolbar-icon',
        },
        React.createElement('path', {
          d:
              'm12 6.314 5.714 3.165v-1.27L12 5.054c-0.85 0.47 -4.957 2.74 -5.714 3.157 0.703 0.39 8.085 4.467 12.572 6.946v1.264L12 20.209c-1.71 -0.943 -5.15 -2.844 -6.858 -3.79v-3.788L12 16.42l1.144 -0.632 -9.146 -5.05v6.316L12 21.472l8 -4.42v-2.526L8.57 8.21Zm-8.002 0.632v2.528l11.428 6.316 -3.428 1.896 -5.714 -3.165v1.27l5.714 3.156c0.85 -0.47 4.957 -2.74 5.714 -3.157 -0.703 -0.39 -8.083 -4.467 -12.57 -6.948V7.578L12 3.789c1.707 0.945 5.148 2.846 6.858 3.789v3.789L12 7.577l-1.144 0.633L20 13.263V6.946l-8 -4.42c-0.791 0.438 -7.416 4.1 -8.002 4.42zM12 0 1.713 5.685v12.63L12 24l10.287 -5.682V5.685Zm9.14 17.683L12 22.736l-9.143 -5.053V6.317L12 1.264l9.143 5.053z',
          fill: 'currentColor',
          strokeWidth: '1',
        })
    );

    function Settings({changeFn, headers}) {
      return React.createElement(React.Fragment, null,
          React.createElement(
              'div',
              {
                className: 'graphiql-dialog-section'
              },
              React.createElement(
                  'div',
                  null,
                  React.createElement(
                      'div',
                      {
                        className: 'graphiql-dialog-section-title'
                      },
                      'Namespace'
                  ),
                  React.createElement(
                      'div',
                      {
                        className: 'graphiql-dialog-section-caption'
                      },
                      'The namespace for the query.'
                  ),
              ),
              React.createElement(
                  "input",
                  {
                    value: headers['surreal-ns'],
                    onChange: (e) => changeFn('surreal-ns', e.target.value),
                  }
              )
          ),
          React.createElement(
              'div',
              {
                className: 'graphiql-dialog-section'
              },
              React.createElement(
                  'div',
                  null,
                  React.createElement(
                      'div',
                      {
                        className: 'graphiql-dialog-section-title'
                      },
                      'Database'
                  ),
                  React.createElement(
                      'div',
                      {
                        className: 'graphiql-dialog-section-caption'
                      },
                      'The database for the query.'
                  ),
              ),
              React.createElement(
                  "input",
                  {
                    value: headers['surreal-db'],
                    onChange: (e) => changeFn('surreal-db', e.target.value),
                  }
              )
          ),
          React.createElement(
              'div',
              {
                className: 'graphiql-dialog-section'
              },
              React.createElement(
                  'div',
                  null,
                  React.createElement(
                      'div',
                      {
                        className: 'graphiql-dialog-section-title'
                      },
                      'Authentication'
                  ),
                  React.createElement(
                      'div',
                      {
                        className: 'graphiql-dialog-section-caption'
                      },
                      'Authentication credentials for the query/introspection. e.g. Basic username:password as base64 or Bearer token.'
                  ),
              ),
              React.createElement(
                  "input",
                  {
                    value: headers['auth'],
                    onChange: (e) => changeFn('auth', e.target.value),
                    placeholder: 'Basic base64(username:password) or Bearer token',
                  }
              )
          )
      )
    }

    const createUrl = (endpoint, subscription = false) => {
      const url = new URL(endpoint, window.location.origin);
      if (subscription) {
        url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
      }
      return url.toString();
    };

    function App() {
      const [showSurreal, setShowSurreal] = React.useState(false);
      const [headers, setHeaders] = React.useState({
        'surreal-ns': '',
        'surreal-db': '',
        'auth': '',
      });

      const handleShowDialog = () => {
        setShowSurreal(true);
      };

      const handleOpenSurrealDialog = (isOpen) => {
        if (!isOpen) {
          setShowSurreal(false);
        }
      };

      const handleHeaderChange = (key, value) => {
        setHeaders(prevHeaders => ({
          ...prevHeaders,
          [key]: value,
        }));
      };

      const fetcher = createGraphiQLFetcher({
        url: createUrl('/graphql'),
        headers,
        fetch: (url, opts) => fetch(url, {...opts, credentials: 'same-origin'}),
      });

      const plugins = [HISTORY_PLUGIN, explorerPlugin()];

      return React.createElement(React.Fragment, null,
          React.createElement(
              GraphiQL,
              {
                fetcher,
                plugins,
                defaultEditorToolsVisibility: true,
              },
          ),
          React.createElement(
              UnStyledButton,
              {
                label: "SurrealDB Settings",
                type: 'button',
                className: 'surreal-button surreal-button-position',
                onClick: handleShowDialog,
              },
              React.createElement(SurrealDBIcon, null),
          ),
          React.createElement(
              Dialog,
              {
                open: showSurreal,
                onOpenChange: handleOpenSurrealDialog,
              },
              React.createElement(
                  'div',
                  {
                    className: "graphiql-dialog-header"
                  },
                  React.createElement(
                      'div',
                      null,
                      React.createElement(
                          Dialog.Title,
                          {
                            className: 'graphiql-dialog-title'
                          },
                          'SurrealDB Connection Settings'
                      ),
                      React.createElement(
                          Dialog.Description,
                          null,
                          'Configure your SurrealDB connection settings here.'
                      ),
                  ),
                  React.createElement(Dialog.Close, null)
              ),
              React.createElement(Settings, {
                changeFn: handleHeaderChange,
                headers
              })
          )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('graphiql'));
    root.render(React.createElement(App));
  </script>
</head>
<body>
<div id="graphiql">
  <div class="loading">Loading...</div>
</div>
</body>
</html>
